<!doctype html>
<html>
  <head>
    <title>Fintrax Budget</title>
    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial;
        background: #050c18;
        color: white;
        display: flex;
      }

      .sidebar {
        width: 260px;
        background: #020914;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding-top: 25px;
        border-right: 1px solid #0e1a2b;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 34px;
        font-weight: bold;
        color: #21c7ea;
        padding: 0 25px;
      }

      .menu {
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .menu button {
        background: none;
        border: none;
        color: #9db0c3;
        padding: 16px 25px;
        text-align: left;
        font-size: 16px;
        cursor: pointer;
        border-radius: 30px;
        margin: 0 12px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .menu button:hover {
        background: #0f1b2d;
      }

      .menu button.active {
        background: linear-gradient(90deg, #21c7ea, #1aa4c9);
        color: #001018;
        font-weight: 600;
      }

      .logout {
        margin: 15px;
        padding: 15px 25px;
        border: none;
        background: none;
        color: #9db0c3;
        text-align: left;
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logout:hover {
        background: #0f1b2d;
      }

      .main {
        flex: 1;
        padding: 35px 45px;
      }

      .topbar {
        display: flex;
        justify-content: flex-start;
        align-items: center;
      }

      .title h1 {
        margin: 0;
        font-size: 38px;
      }

      .title p {
        margin-top: 5px;
        color: #8aa0b4;
      }

      .card {
        background: linear-gradient(145deg, #101b2e, #0c1626);
        border-radius: 25px;
        padding: 28px;
        border: 1px solid #1b2e46;
        margin-top: 30px;
      }

      .row {
        display: flex;
        gap: 20px;
        margin-top: 15px;
      }

      select,
      input {
        flex: 1;
        padding: 14px;
        border-radius: 14px;
        border: 1px solid #1b2e46;
        background: #0b1626;
        color: white;
      }

      button.action {
        padding: 14px 25px;
        border-radius: 14px;
        border: none;
        background: linear-gradient(90deg, #21c7ea, #1aa4c9);
        color: #001018;
        font-weight: 600;
        cursor: pointer;
      }

      .list {
        margin-top: 20px;
      }

      .item {
        margin-top: 22px;
      }

      .top {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .bar {
        width: 100%;
        height: 10px;
        background: #0b1626;
        border-radius: 12px;
        overflow: hidden;
      }

      .fill {
        height: 100%;
        background: #21c7ea;
      }
    </style>
  </head>

  <body>
    <div class="sidebar">
      <div>
        <div class="logo">⚡Fintrax</div>

        <div class="menu">
          <button onclick="home()">Dashboard</button>
          <button onclick="transaction()">Transactions</button>
          <button class="active">Budget</button>
          <button onclick="categorize()">Categorize</button>
          <button onclick="graphs()">Graphs</button>
          <button onclick="patterns()">Patterns</button>
          <button onclick="recommendations()">AI Insights</button>
        </div>
      </div>

      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="title">
          <h1>Budget</h1>
          <p>Set and track your category limits</p>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <select id="cat">
            <option>Food</option>
            <option>Travel</option>
            <option>Groceries</option>
            <option>Tech</option>
            <option>Utilities</option>
            <option>Shopping</option>
            <option>Other</option>
          </select>

          <input type="number" id="catLimit" placeholder="Limit Amount" />

          <button class="action" onclick="addBudget()">Set Limit</button>
        </div>
      </div>

      <div class="card">
        <div id="budgetList" class="list"></div>
      </div>
    </div>

    <script>
      function logout() {
        window.location.href = "login.html";
      }
      function home() {
        window.location.href = "home.html";
      }
      function transaction() {
        window.location.href = "transaction.html";
      }
      function categorize() {
        window.location.href = "categorize.html";
      }
      function graphs() {
        window.location.href = "graphs.html";
      }
      function patterns() {
        window.location.href = "spend.html";
      }
      function recommendations() {
        window.location.href = "recommendations.html";
      }

      async function addBudget() {
        const category = document.getElementById("cat").value;
        const amount = document.getElementById("catLimit").value;
        const userId = localStorage.getItem("userId");

        const res = await fetch("/set-budget", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId, category, amount }),
        });

        const data = await res.json();
        if (data.success) {
          loadBudgets();
        }
      }

      async function loadBudgets() {
        const userId = localStorage.getItem("userId");
        const res = await fetch(`/budget-data?userId=${userId}`);
        const data = await res.json();

        const box = document.getElementById("budgetList");
        box.innerHTML = "";

        if (!data.limits) return;

        data.limits.forEach((b) => {
          const spend = data.spent.find((s) => s.category === b.category);
          const used = spend ? Number(spend.spent) : 0;
          const percent = Math.min((used / b.amount) * 100, 100);

          const div = document.createElement("div");
          div.className = "item";

          div.innerHTML = `
<div class="top">
<div>${b.category} - ₹${used} / ₹${b.amount}</div>
</div>
<div class="bar">
<div class="fill" style="width:${percent}%"></div>
</div>
`;

          box.appendChild(div);
        });
      }

      loadBudgets();
    </script>
  </body>
</html>
