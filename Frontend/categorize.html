<!doctype html>
<html>
  <head>
    <title>Categorize | Fintrax</title>

    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial;
        background: #050c18;
        color: white;
        display: flex;
      }

      .sidebar {
        width: 260px;
        background: #020914;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding-top: 25px;
        border-right: 1px solid #0e1a2b;
      }

      .logo {
        font-size: 34px;
        font-weight: bold;
        color: #21c7ea;
        padding: 0 25px;
      }

      .menu {
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .menu button {
        background: none;
        border: none;
        color: #9db0c3;
        padding: 16px 25px;
        text-align: left;
        font-size: 16px;
        cursor: pointer;
        border-radius: 30px;
        margin: 0 12px;
      }

      .menu button:hover {
        background: #0f1b2d;
      }

      .menu button.active {
        background: linear-gradient(90deg, #21c7ea, #1aa4c9);
        color: #001018;
        font-weight: 600;
      }

      .logout {
        margin: 15px;
        padding: 15px 25px;
        border: none;
        background: none;
        color: #9db0c3;
        cursor: pointer;
      }

      .main {
        flex: 1;
        padding: 35px 45px;
      }

      .title h1 {
        margin: 0;
        font-size: 38px;
      }

      .title p {
        margin-top: 5px;
        color: #8aa0b4;
      }

      .card {
        background: linear-gradient(145deg, #101b2e, #0c1626);
        border-radius: 25px;
        padding: 28px;
        border: 1px solid #1b2e46;
        margin-top: 35px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        padding: 14px;
        border-bottom: 1px solid #1b2e46;
        text-align: center;
        color: #c7d7ea;
      }

      th {
        color: #8aa0b4;
        font-weight: 500;
      }

      tr:hover {
        background: #0b1626;
      }

      select {
        padding: 8px;
        width: 100%;
        border-radius: 10px;
        border: 1px solid #1b2e46;
        background: #0b1626;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="sidebar">
      <div>
        <div class="logo">⚡Fintrax</div>

        <div class="menu">
          <button onclick="home()">Dashboard</button>
          <button onclick="transaction()">Transactions</button>
          <button onclick="budget()">Budget</button>
          <button class="active">Categorize</button>
          <button onclick="graphs()">Graphs</button>
          <button onclick="patterns()">Patterns</button>
          <button onclick="recommendations()">AI Insights</button>
        </div>
      </div>

      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <div class="main">
      <div class="title">
        <h1>Categorize Transactions</h1>
        <p>Assign categories to your expenses</p>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Merchant</th>
              <th>Amount (₹)</th>
              <th>Category</th>
            </tr>
          </thead>
          <tbody id="categoryTable"></tbody>
        </table>
      </div>
    </div>

    <script>
      function logout() {
        window.location.href = "login.html";
      }
      function home() {
        window.location.href = "home.html";
      }
      function transaction() {
        window.location.href = "transaction.html";
      }
      function budget() {
        window.location.href = "budget.html";
      }
      function graphs() {
        window.location.href = "graphs.html";
      }
      function patterns() {
        window.location.href = "spend.html";
      }
      function recommendations() {
        window.location.href = "recommendations.html";
      }

      const categories = [
        "Food",
        "Travel",
        "Groceries",
        "Tech",
        "Utilities",
        "Shopping",
        "Other",
      ];

      async function loadTransactions() {
        const tbody = document.getElementById("categoryTable");
        const userId = localStorage.getItem("userId");

        const res = await fetch(`/transactions?userId=${userId}`);
        const data = await res.json();

        tbody.innerHTML = "";

        if (!data.data || data.data.length === 0) {
          tbody.innerHTML = `<tr><td colspan="4">No transactions found</td></tr>`;
          return;
        }

        data.data.forEach((t) => {
          const row = document.createElement("tr");

          row.innerHTML = `
<td>${t.date}</td>
<td>${t.vendor}</td>
<td>${t.total}</td>
<td>
<select onchange="updateCategory(${t.id},this.value)">
<option value="">Select Category</option>
${categories.map((c) => `<option ${t.category === c ? "selected" : ""}>${c}</option>`).join("")}
</select>
</td>
`;

          tbody.appendChild(row);
        });
      }

      async function updateCategory(id, category) {
        await fetch("/update-category", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, category }),
        });
      }

      loadTransactions();
    </script>
  </body>
</html>
