<!doctype html>
<html>
  <head>
    <title>Fintrax Login</title>

    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(90deg, #0a1626, #081220);
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial;
        color: white;
      }

      .box {
        background: linear-gradient(145deg, #101b2e, #0c1626);
        border: 1px solid #1b2e46;
        border-radius: 28px;
        padding: 50px 60px;
      }

      .container {
        width: 520px;
        text-align: center;
      }

      .logo {
        font-size: 36px;
        font-weight: 700;
        color: #21c7ea;
        margin-bottom: 40px;
      }

      .row {
        display: flex;
        align-items: center;
        margin-bottom: 22px;
      }

      .row label {
        width: 120px;
        text-align: left;
        color: #9db0c3;
        font-size: 16px;
      }

      .row input {
        flex: 1;
        padding: 16px;
        border-radius: 18px;
        border: 1px solid #1b2e46;
        background: #07121f;
        color: white;
        font-size: 16px;
        outline: none;
      }

      .row input:focus {
        border-color: #21c7ea;
      }

      button {
        margin-top: 20px;
        padding: 16px 40px;
        border-radius: 18px;
        border: none;
        background: #1fb6d9;
        color: #001018;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.25s;
      }

      button:hover {
        transform: translateY(-2px);
      }

      a {
        display: block;
        margin-top: 22px;
        color: #21c7ea;
        text-decoration: none;
        font-size: 18px;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>

    <script>
      async function loginUser(event) {
        event.preventDefault();

        const mob = document.getElementById("mob").value;
        const password = document.getElementById("password").value;

        const response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mob, password }),
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem("userId", data.userId);
          window.location.href = data.redirect;
        } else {
          alert(data.message || "Login failed");
        }
      }
    </script>
  </head>

  <body>
    <div class="box">
      <div class="container">
        <div class="logo">⚡ Fintrax</div>

        <form onsubmit="loginUser(event)">
          <div class="row">
            <label>Mobile No</label>
            <input id="mob" type="tel" required />
          </div>

          <div class="row">
            <label>Password</label>
            <input id="password" type="password" required />
          </div>

          <button type="submit">Log in</button>

          <a href="register.html">Doesn't have an account? Register</a>
        </form>
      </div>
    </div>
  </body>
</html>
