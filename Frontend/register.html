<!doctype html>
<html>
  <head>
    <title>Fintrax Registration</title>

    <style>
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(90deg, #0a1626, #081220);
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial;
        color: white;
      }

      form {
        background: linear-gradient(145deg, #101b2e, #0c1626);
        padding: 40px;
        border-radius: 28px;
        border: 1px solid #1b2e46;
        width: 420px;
      }

      .form-row {
        display: flex;
        align-items: center;
        margin-bottom: 18px;
      }

      .form-row label {
        width: 140px;
        font-size: 14px;
        color: #9db0c3;
      }

      .form-row input {
        flex: 1;
        padding: 12px;
        font-size: 14px;
        border: 1px solid #1b2e46;
        border-radius: 14px;
        background: #07121f;
        color: #c7d7ea;
        outline: none;
      }

      .form-row input:focus {
        border-color: #21c7ea;
      }

      input[type="submit"] {
        width: 100%;
        padding: 14px;
        font-size: 16px;
        font-weight: 600;
        border-radius: 18px;
        border: none;
        background: #1fb6d9;
        color: #001018;
        cursor: pointer;
        transition: 0.25s;
        margin-top: 12px;
      }

      input[type="submit"]:hover {
        transform: translateY(-2px);
      }
    </style>

    <script>
      async function validateForm(event) {
        event.preventDefault();

        var name = document.getElementById("name").value;
        var mob = document.getElementById("mob").value;
        var email = document.getElementById("email").value;
        var password = document.getElementById("password").value;
        var confirmPassword = document.getElementById("confirmpassword").value;

        if (password !== confirmPassword) {
          alert("Passwords do not match!");
          return false;
        }

        const response = await fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, mob, email, password }),
        });

        const data = await response.json();

        if (data.success) {
          alert("Registration successful!");
          window.location.href = data.redirect;
        } else {
          alert("Registration failed: " + (data.message || ""));
        }
      }
    </script>
  </head>

  <body>
    <form name="myform" onsubmit="validateForm(event)">
      <div class="form-row">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required />
      </div>

      <div class="form-row">
        <label for="mob">Mobile No:</label>
        <input type="tel" id="mob" name="mob" required />
      </div>

      <div class="form-row">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />
      </div>

      <div class="form-row">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required />
      </div>

      <div class="form-row">
        <label for="confirmpassword">Confirm Password:</label>
        <input
          type="password"
          id="confirmpassword"
          name="confirmpassword"
          required
        />
      </div>

      <input type="submit" value="Submit" />
    </form>
  </body>
</html>
