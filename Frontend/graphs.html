<!doctype html>
<html>
  <head>
    <title>Graphs | Fintrax</title>

    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial;
        background: #050c18;
        color: white;
        display: flex;
      }

      .sidebar {
        width: 260px;
        background: #020914;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding-top: 25px;
        border-right: 1px solid #0e1a2b;
      }

      .logo {
        font-size: 34px;
        font-weight: bold;
        color: #21c7ea;
        padding: 0 25px;
      }

      .menu {
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .menu button {
        background: none;
        border: none;
        color: #9db0c3;
        padding: 16px 25px;
        text-align: left;
        font-size: 16px;
        cursor: pointer;
        border-radius: 30px;
        margin: 0 12px;
      }

      .menu button:hover {
        background: #0f1b2d;
      }

      .menu button.active {
        background: linear-gradient(90deg, #21c7ea, #1aa4c9);
        color: #001018;
        font-weight: 600;
      }

      .logout {
        margin: 15px;
        padding: 15px 25px;
        border: none;
        background: none;
        color: #9db0c3;
        cursor: pointer;
      }

      .main {
        flex: 1;
        padding: 35px 45px;
      }

      .title h1 {
        margin: 0;
        font-size: 38px;
      }
      .title p {
        margin-top: 5px;
        color: #8aa0b4;
      }

      .card {
        background: linear-gradient(145deg, #101b2e, #0c1626);
        border-radius: 25px;
        padding: 28px;
        border: 1px solid #1b2e46;
        margin-top: 35px;
      }

      canvas {
        width: 100%;
        height: 300px;
        background: #0b1626;
        border-radius: 14px;
      }
    </style>
  </head>

  <body>
    <div class="sidebar">
      <div>
        <div class="logo">⚡Fintrax</div>
        <div class="menu">
          <button onclick="home()">Dashboard</button>
          <button onclick="transaction()">Transactions</button>
          <button onclick="budget()">Budget</button>
          <button onclick="categorize()">Categorize</button>
          <button class="active">Graphs</button>
          <button onclick="patterns()">Patterns</button>
          <button onclick="recommendations()">AI Insights</button>
        </div>
      </div>
      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <div class="main">
      <div class="title">
        <h1>Expense Graphs</h1>
        <p>Generated from categorized expenses</p>
      </div>

      <div class="card">
        <canvas id="barChart"></canvas>
      </div>

      <div class="card">
        <canvas id="pieChart"></canvas>
      </div>
    </div>

    <script>
      function logout() {
        window.location.href = "login.html";
      }
      function home() {
        window.location.href = "home.html";
      }
      function transaction() {
        window.location.href = "transaction.html";
      }
      function budget() {
        window.location.href = "budget.html";
      }
      function categorize() {
        window.location.href = "categorize.html";
      }
      function patterns() {
        window.location.href = "spend.html";
      }
      function recommendations() {
        window.location.href = "recommendations.html";
      }

      async function loadGraphs() {
        const userId = localStorage.getItem("userId");

        const res = await fetch(`/graphs-data?userId=${userId}`);
        const data = await res.json();

        drawBar(data.category || []);
        drawPie(data.category || []);
      }

      function drawBar(list) {
        const canvas = document.getElementById("barChart");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const w = canvas.width;
        const h = canvas.height;
        const bw = 50;
        const gap = 30;

        const max = Math.max(...list.map((x) => Number(x.amount)), 1);

        list.forEach((c, i) => {
          const x = i * (bw + gap) + 40;
          const bh = (c.amount / max) * (h - 60);
          ctx.fillStyle = "#21c7ea";
          ctx.fillRect(x, h - bh - 20, bw, bh);
          ctx.fillStyle = "#9db0c3";
          ctx.fillText(c.category, x, h - 5);
        });
      }

      function drawPie(list) {
        const canvas = document.getElementById("pieChart");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const total = list.reduce((a, b) => a + Number(b.amount), 0);

        let start = 0;

        list.forEach((c, i) => {
          const slice = (c.amount / total) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(160, 150);
          ctx.fillStyle = `hsl(${i * 70},70%,60%)`;
          ctx.arc(160, 150, 120, start, start + slice);
          ctx.fill();
          start += slice;
        });
      }

      loadGraphs();
    </script>
  </body>
</html>
