<!doctype html>
<html>
  <head>
    <title>Graphs | Fintrax</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
        background: #050c18;
        color: white;
        display: flex;
      }

      .sidebar {
        width: 260px;
        background: #020914;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding-top: 25px;
        border-right: 1px solid #0e1a2b;
      }

      .logo {
        font-size: 34px;
        font-weight: bold;
        color: #21c7ea;
        padding: 0 25px;
      }

      .menu {
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .menu button {
        background: none;
        border: none;
        color: #9db0c3;
        padding: 16px 25px;
        text-align: left;
        font-size: 16px;
        cursor: pointer;
        border-radius: 30px;
        margin: 0 12px;
      }

      .menu button:hover {
        background: #0f1b2d;
      }

      .menu button.active {
        background: linear-gradient(90deg, #21c7ea, #1aa4c9);
        color: #001018;
        font-weight: 600;
      }

      .logout {
        margin: 15px;
        padding: 15px 25px;
        border: none;
        background: none;
        color: #9db0c3;
        cursor: pointer;
      }

      .main {
        flex: 1;
        padding: 35px 45px;
      }

      .title h1 {
        margin: 0;
        font-size: 38px;
      }
      .title p {
        margin-top: 5px;
        color: #8aa0b4;
      }

      .card {
        background: linear-gradient(145deg, #101b2e, #0c1626);
        border-radius: 25px;
        padding: 28px;
        border: 1px solid #1b2e46;
        margin-top: 35px;
      }

      canvas {
        width: 100%;
        height: 300px;
      }
    </style>
  </head>

  <body>
    <div class="sidebar">
      <div>
        <div class="logo">⚡Fintrax</div>
        <div class="menu">
          <button onclick="home()">Dashboard</button>
          <button onclick="transaction()">Transactions</button>
          <button onclick="budget()">Budget</button>
          <button onclick="categorize()">Categorize</button>
          <button class="active">Graphs</button>
          <button onclick="patterns()">Patterns</button>
          <button onclick="recommendations()">AI Insights</button>
        </div>
      </div>
      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <div class="main">
      <div class="title">
        <h1>Expense Graphs</h1>
        <p>Generated from categorized expenses</p>
      </div>

      <div class="card">
        <canvas id="barChart"></canvas>
      </div>

      <div class="card">
        <canvas id="pieChart"></canvas>
      </div>
    </div>

    <script>
      function logout() {
        window.location.href = "login.html";
      }
      function home() {
        window.location.href = "home.html";
      }
      function transaction() {
        window.location.href = "transaction.html";
      }
      function budget() {
        window.location.href = "budget.html";
      }
      function categorize() {
        window.location.href = "categorize.html";
      }
      function patterns() {
        window.location.href = "spend.html";
      }
      function recommendations() {
        window.location.href = "recommendations.html";
      }

      let barChartInstance;
      let pieChartInstance;

      async function loadGraphs() {
        const userId = localStorage.getItem("userId");

        const res = await fetch(`/graphs-data?userId=${userId}`);
        const data = await res.json();

        const list = data.category || [];

        const labels = list.map((x) => x.category);
        const values = list.map((x) => Number(x.amount));

        drawBar(labels, values);
        drawPie(labels, values);
      }

      function drawBar(labels, values) {
        const ctx = document.getElementById("barChart");

        if (barChartInstance) barChartInstance.destroy();

        barChartInstance = new Chart(ctx, {
          type: "bar",
          data: {
            labels: labels,
            datasets: [
              {
                label: "Expenses",
                data: values,
                backgroundColor: "#21c7ea",
                borderRadius: 8,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
            },
            scales: {
              x: {
                ticks: { color: "#9db0c3" },
                grid: { display: false },
              },
              y: {
                ticks: { color: "#9db0c3" },
                grid: { color: "#1b2e46" },
              },
            },
          },
        });
      }

      function drawPie(labels, values) {
        const ctx = document.getElementById("pieChart");

        if (pieChartInstance) pieChartInstance.destroy();

        pieChartInstance = new Chart(ctx, {
          type: "pie",
          data: {
            labels: labels,
            datasets: [
              {
                data: values,
                backgroundColor: labels.map(
                  (_, i) => `hsl(${i * 70},70%,60%)`
                ),
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: {
                labels: {
                  color: "#9db0c3",
                },
              },
            },
          },
        });
      }

      loadGraphs();
    </script>
  </body>
</html>
