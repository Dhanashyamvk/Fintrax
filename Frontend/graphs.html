<!DOCTYPE html>
<html>
<head>
  <title>View Graphs</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: "Lucida Console", "Courier New", monospace;
      background-color: lch(69.62% 69.26 150.57 / 0.901);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      color: #000;
    }

    .container {
      margin-top: 40px;
      width: 90%;
      max-width: 950px;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.25);
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      font-size: 32px;
    }

    .chart-box {
      margin-bottom: 40px;
      padding: 20px;
      border-radius: 14px;
      background: #fafafa;
      box-shadow: inset 0 0 0 1px #ddd;
    }

    h2 {
      text-align: center;
      margin-bottom: 15px;
      font-size: 18px;
    }

    canvas {
      width: 100%;
      height: 300px;
      border-radius: 10px;
      background: white;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Expense Overview</h1>

    <div class="chart-box">
      <h2>Monthly Expenses (Bar Chart)</h2>
      <canvas id="barChart"></canvas>
    </div>

    <div class="chart-box">
      <h2>Category Distribution (Pie Chart)</h2>
      <canvas id="pieChart"></canvas>
    </div>
  </div>
