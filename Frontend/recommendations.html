<!DOCTYPE html>
<html>
<head>
    <title>Recommendations | Fintrax</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: lch(69.62% 69.26 150.57 / 0.901);
            font-family: "Lucida Console", "Courier New", monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #000;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        header h1 {
            margin: 10px 0;
            font-size: 36px;
            font-weight: bold;
        }

        header h3 {
            margin-top: 10px;
            font-weight: normal;
        }

        .container {
            background: white;
            color: #000;
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }

        .recommendation {
            background: #f7f7f7;
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 15px;
            font-size: 16px;
            line-height: 1.5;
        }

        .recommendation span {
            font-weight: bold;
            color: rgba(21, 195, 105, 0.901);
        }

        .back-btn {
            margin: 30px 0;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            background-color: #ffffff;
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: "Lucida Console", "Courier New", monospace;
        }

        .back-btn:hover {
            background-color: lch(69.62% 69.26 150.57 / 0.901);
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

<header>
    <h1>Smart Recommendations</h1>
    <h3>Improve your spending habits</h3>
</header>

<div class="container" id="recommendationsBox">
    <!-- Recommendations will load here -->
</div>

<button class="back-btn" onclick="goBack()">Back to Dashboard</button>

<script>
    // Sample spending data (later connect to backend)
    const expenses = [
        { category: "Food", amount: 4500 },
        { category: "Shopping", amount: 6800 },
        { category: "Transport", amount: 2200 },
        { category: "Bills", amount: 3000 }
    ];

    function generateRecommendations() {
        const box = document.getElementById("recommendationsBox");
        box.innerHTML = "";

        expenses.forEach(e => {
            if (e.amount > 5000) {
                box.innerHTML += `
                    <div class="recommendation">
                        ⚠ You are spending heavily on <span>${e.category}</span>.
                        Try setting a monthly limit to save more.
                    </div>
                `;
            }
        });

        box.innerHTML += `
            <div class="recommendation">
                💡 Track your expenses daily to avoid last-minute overspending.
            </div>
        `;

        box.innerHTML += `
            <div class="recommendation">
                💰 Consider allocating at least <span>20%</span> of your income to savings.
            </div>
        `;

        box.innerHTML += `
            <div class="recommendation">
                📊 Review your spending patterns every month for better control.
            </div>
        `;
    }

    function goBack() {
        window.location.href = "home.html";
    }

    generateRecommendations();
</script>

</body>
</html>
