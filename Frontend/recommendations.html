<!doctype html>
<html>
  <head>
    <title>Recommendations | Fintrax</title>

    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial;
        background: #050c18;
        color: white;
        display: flex;
      }

      .sidebar {
        width: 260px;
        background: #020914;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding-top: 25px;
        border-right: 1px solid #0e1a2b;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 34px;
        font-weight: bold;
        color: #21c7ea;
        padding: 0 25px;
      }

      .menu {
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .menu button {
        background: none;
        border: none;
        color: #9db0c3;
        padding: 16px 25px;
        text-align: left;
        font-size: 16px;
        cursor: pointer;
        border-radius: 30px;
        margin: 0 12px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .menu button:hover {
        background: #0f1b2d;
      }

      .menu button.active {
        background: linear-gradient(90deg, #21c7ea, #1aa4c9);
        color: #001018;
        font-weight: 600;
      }

      .logout {
        margin: 15px;
        padding: 15px 25px;
        border: none;
        background: none;
        color: #9db0c3;
        text-align: left;
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .logout:hover {
        background: #0f1b2d;
      }

      .main {
        flex: 1;
        padding: 35px 45px;
      }

      .topbar {
        display: flex;
        justify-content: flex-start;
        align-items: center;
      }

      .title h1 {
        margin: 0;
        font-size: 38px;
      }

      .title p {
        margin-top: 5px;
        color: #8aa0b4;
      }

      .card {
        background: linear-gradient(145deg, #101b2e, #0c1626);
        border-radius: 25px;
        padding: 28px;
        border: 1px solid #1b2e46;
        margin-top: 35px;
      }

      .recommendation {
        background: #0b1626;
        border: 1px solid #1b2e46;
        padding: 18px;
        border-radius: 18px;
        margin-bottom: 15px;
        color: #c7d7ea;
      }

      .recommendation span {
        color: #21c7ea;
        font-weight: 600;
      }
    </style>
  </head>

  <body>
    <div class="sidebar">
      <div>
        <div class="logo">⚡Fintrax</div>

        <div class="menu">
          <button onclick="home()">Dashboard</button>
          <button onclick="transaction()">Transactions</button>
          <button onclick="budget()">Budget</button>
          <button onclick="categorize()">Categorize</button>
          <button onclick="graphs()">Graphs</button>
          <button onclick="patterns()">Patterns</button>
          <button class="active">AI Insights</button>
        </div>
      </div>

      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="title">
          <h1>Smart Recommendations</h1>
          <p>Improve your spending habits</p>
        </div>
      </div>

      <div class="card">
        <h2>Smart Recommendations</h2>
        <div id="recommendationsBox"></div>
      </div>

      <div class="card">
        <h2>Future Spending Predictions</h2>
        <div id="futureBox"></div>
      </div>
    </div>

    <script>
      function logout() {
        window.location.href = "login.html";
      }
      function home() {
        window.location.href = "home.html";
      }
      function transaction() {
        window.location.href = "transaction.html";
      }
      function budget() {
        window.location.href = "budget.html";
      }
      function categorize() {
        window.location.href = "categorize.html";
      }
      function graphs() {
        window.location.href = "graphs.html";
      }
      function patterns() {
        window.location.href = "spend.html";
      }

      async function generateRecommendations() {
        const userId = localStorage.getItem("userId");

        const recBox = document.getElementById("recommendationsBox");
        const futureBox = document.getElementById("futureBox");

        recBox.innerHTML = `<div class="recommendation">Loading AI...</div>`;
        futureBox.innerHTML = `<div class="recommendation">Loading predictions...</div>`;

        try {
          const recRes = await fetch(`/ai-recommendations?userId=${userId}`);
          const recData = await recRes.json();

          const futureRes = await fetch(`/future-spending?userId=${userId}`);
          const futureData = await futureRes.json();

          recBox.innerHTML = "";
          futureBox.innerHTML = "";

          if (
            !recData.recommendations ||
            recData.recommendations.length === 0
          ) {
            recBox.innerHTML = `<div class="recommendation">No AI recommendations yet.</div>`;
          } else {
            recData.recommendations.forEach((text) => {
              const lines = text.split("\n");

              let html = `<div class="recommendation">`;

              lines.forEach((line) => {
                html += `<div>${line}</div>`;
              });

              html += `</div>`;

              recBox.innerHTML += html;
            });
          }

          futureBox.innerHTML = `
<div class="recommendation">
Total Predicted Future Spending: ₹${Number(futureData.prediction || 0).toFixed(2)}
</div>
`;
        } catch (err) {
          console.error("AI ERROR:", err);

          recBox.innerHTML = `<div class="recommendation">Failed to load AI recommendations.</div>`;
          futureBox.innerHTML = `<div class="recommendation">Failed to load predictions.</div>`;
        }
      }
      generateRecommendations();
    </script>
  </body>
</html>
