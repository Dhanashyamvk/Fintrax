<!DOCTYPE html>
<html>
<head>
    <title>Spending Patterns | Fintrax</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: lch(69.62% 69.26 150.57 / 0.901);
            font-family: "Lucida Console", "Courier New", monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #000;
            min-height: 100vh;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
        }

        header h1 {
            margin: 10px 0;
            font-size: 34px;
            font-weight: bold;
        }

        header h3 {
            margin-top: 10px;
            font-weight: normal;
        }

        .container {
            background: white;
            color: #000;
            width: 90%;
            max-width: 820px;
            margin: 30px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background: #f7f7f7;
            padding: 22px;
            border-radius: 16px;
            text-align: center;
        }

        .card h2 {
            margin-bottom: 10px;
            font-size: 18px;
            color: rgba(21, 195, 105, 0.901);
        }

        .card p {
            font-size: 20px;
            font-weight: bold;
            margin: 0;
        }

        .insight {
            margin-top: 30px;
            padding: 20px;
            background: #f2f2f2;
            border-radius: 16px;
            font-size: 16px;
            text-align: center;
        }

        .back-btn {
            margin: 30px 0;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: bold;
            background-color: #ffffff;
            color: #000;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: "Lucida Console", "Courier New", monospace;
        }

        .back-btn:hover {
            background-color: lch(69.62% 69.26 150.57 / 0.901);
            transform: translateY(-3px);
        }
    </style>
</head>

<body>

<header>
    <h1>Spending Patterns</h1>
    <h3>Understand where your money goes</h3>
</header>

<div class="container">

    <div class="cards">
        <div class="card">
            <h2>Total Spending</h2>
            <p id="total">₹0</p>
        </div>

        <div class="card">
            <h2>Top Category</h2>
            <p id="topCategory">—</p>
        </div>

        <div class="card">
            <h2>Average / Day</h2>
            <p id="average">₹0</p>
        </div>
    </div>

    <div class="insight" id="insight">
        Loading insights...
    </div>

</div>

<button class="back-btn" onclick="goBack()">Back to Dashboard</button>

<script>
    const expenses = [
        { category: "Food", amount: 4500 },
        { category: "Transport", amount: 2200 },
        { category: "Shopping", amount: 6800 },
        { category: "Bills", amount: 3000 }
    ];

    function analyzePatterns() {
        let total = 0;
        let highest = expenses[0];

        expenses.forEach(e => {
            total += e.amount;
            if (e.amount > highest.amount) highest = e;
        });

        document.getElementById("total").innerText = "₹" + total;
        document.getElementById("topCategory").innerText = highest.category;
        document.getElementById("average").innerText = "₹" + Math.round(total / 30);

        const insightText =
            highest.amount > 5000
                ? `⚠ You are spending most on ${highest.category}. Consider reducing it.`
                : `✅ Your spending on ${highest.category} is under control.`;

        document.getElementById("insight").innerText = insightText;
    }

    function goBack() {
        window.location.href = "home.html";
    }

    analyzePatterns();
</script>

</body>
</html>
