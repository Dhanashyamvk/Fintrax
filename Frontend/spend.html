<!doctype html>
<html>
  <head>
    <title>Spending Patterns | Fintrax</title>

    <style>
      body {
        margin: 0;
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial;
        background: #050c18;
        color: white;
        display: flex;
      }

      .sidebar {
        width: 260px;
        background: #020914;
        height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding-top: 25px;
        border-right: 1px solid #0e1a2b;
      }

      .logo {
        font-size: 34px;
        font-weight: bold;
        color: #21c7ea;
        padding: 0 25px;
      }

      .menu {
        margin-top: 30px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .menu button {
        background: none;
        border: none;
        color: #9db0c3;
        padding: 16px 25px;
        text-align: left;
        font-size: 16px;
        cursor: pointer;
        border-radius: 30px;
        margin: 0 12px;
      }

      .menu button:hover {
        background: #0f1b2d;
      }

      .menu button.active {
        background: linear-gradient(90deg, #21c7ea, #1aa4c9);
        color: #001018;
        font-weight: 600;
      }

      .logout {
        margin: 15px;
        padding: 15px 25px;
        border: none;
        background: none;
        color: #9db0c3;
        cursor: pointer;
      }

      .main {
        flex: 1;
        padding: 35px 45px;
      }

      .title h1 {
        margin: 0;
        font-size: 38px;
      }

      .title p {
        margin-top: 5px;
        color: #8aa0b4;
      }

      .stats {
        margin-top: 30px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 25px;
      }

      .card {
        background: linear-gradient(145deg, #101b2e, #0c1626);
        border-radius: 20px;
        padding: 20px;
        border: 1px solid #1b2e46;
        text-align: center;
      }

      #patternsContainer {
        margin-top: 30px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
      }

      .insight {
        margin-top: 35px;
        background: #0b1626;
        border-radius: 20px;
        padding: 25px;
        border: 1px solid #1b2e46;
        text-align: center;
        color: #c7d7ea;
        font-size: 16px;
      }

      .remaining {
        color: #21c7ea;
      }

      .overspent {
        color: red;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="sidebar">
      <div>
        <div class="logo">⚡Fintrax</div>

        <div class="menu">
          <button onclick="home()">Dashboard</button>
          <button onclick="transaction()">Transactions</button>
          <button onclick="budget()">Budget</button>
          <button onclick="categorize()">Categorize</button>
          <button onclick="graphs()">Graphs</button>
          <button class="active">Patterns</button>
          <button onclick="recommendations()">AI Insights</button>
        </div>
      </div>

      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <div class="main">
      <div class="title">
        <h1>Spending Patterns</h1>
        <p>Understand where your money goes</p>
      </div>

      <!-- TOP STATS FIRST -->

      <div class="stats">
        <div class="card">
          <h4>Total Spending</h4>
          <h2 id="total">₹0</h2>
        </div>

        <div class="card">
          <h4>Top Category</h4>
          <h2 id="topCategory">—</h2>
        </div>

        <div class="card">
          <h4>Average / Day</h4>
          <h2 id="average">₹0</h2>
        </div>
      </div>

      <!-- CATEGORY BUDGET CARDS -->

      <div id="patternsContainer"></div>

      <!-- INSIGHT -->

      <div class="insight" id="insight">Loading insights...</div>
    </div>

    <script>
      function logout() {
        window.location.href = "login.html";
      }
      function home() {
        window.location.href = "home.html";
      }
      function transaction() {
        window.location.href = "transaction.html";
      }
      function budget() {
        window.location.href = "budget.html";
      }
      function categorize() {
        window.location.href = "categorize.html";
      }
      function graphs() {
        window.location.href = "graphs.html";
      }
      function recommendations() {
        window.location.href = "recommendations.html";
      }

      async function loadPatterns() {
        const userId = localStorage.getItem("userId");

        const res = await fetch(`/budget-data?userId=${userId}`);
        const data = await res.json();

        const limits = data.limits;
        const spent = data.spent;

        const container = document.getElementById("patternsContainer");
        container.innerHTML = "";

        let totalSpending = 0;
        let topCategory = "—";
        let maxSpent = 0;

        let alerts = [];

        limits.forEach((b) => {
          const s = spent.find((x) => x.category === b.category);

          const spentAmount = s ? Number(s.spent) : 0;
          const budgetAmount = Number(b.amount);

          totalSpending += spentAmount;

          if (spentAmount > maxSpent) {
            maxSpent = spentAmount;
            topCategory = b.category;
          }

          let statusHTML = "";

          if (spentAmount > budgetAmount) {
            const overspent = (spentAmount - budgetAmount).toFixed(2);

            statusHTML = `<p class="overspent">Overspent: ₹${overspent}</p>`;

            alerts.push(`⚠ ${b.category} exceeded budget by ₹${overspent}`);
          } else {
            const remaining = (budgetAmount - spentAmount).toFixed(2);

            statusHTML = `<p class="remaining">Remaining: ₹${remaining}</p>`;
          }

          const color = spentAmount > budgetAmount ? "red" : "#21c7ea";

          container.innerHTML += `

<div class="card">
<h3>${b.category}</h3>
<p>Budget: ₹${budgetAmount.toFixed(2)}</p>
<p style="color:${color}">Spent: ₹${spentAmount.toFixed(2)}</p>
${statusHTML}
</div>

`;
        });

        document.getElementById("total").innerText =
          `₹${totalSpending.toFixed(2)}`;
        document.getElementById("topCategory").innerText = topCategory;

        const avg = totalSpending > 0 ? (totalSpending / 30).toFixed(2) : 0;

        document.getElementById("average").innerText = `₹${avg}`;

        let insight = "Your spending is balanced.";

        if (alerts.length > 0) {
          insight = alerts.join(" | ");
        } else if (maxSpent > 0) {
          insight = `You spend the most on ${topCategory}. Consider optimizing this category.`;
        }

        document.getElementById("insight").innerText = insight;
      }
      loadPatterns();
    </script>
  </body>
</html>
